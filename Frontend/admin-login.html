<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — MindCare</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a4a;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #6c63ff;
            text-align: center;
            margin-bottom: 6px;
        }

        .badge {
            text-align: center;
            margin-bottom: 28px;
            font-size: 12px;
            font-weight: 700;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #22223a;
            border: 1.5px solid #2a2a4a;
            border-radius: 10px;
            color: #e8e8f0;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .form-group input:focus {
            border-color: #6c63ff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }

        .btn:hover {
            background: #574fd6;
        }

        .btn:disabled {
            background: #3d3872;
            cursor: not-allowed;
        }

        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.error {
            background: #3a1a1a;
            color: #e74c3c;
            border: 1px solid #5a2a2a;
            display: block;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">🌿 MindCare</div>
        <div class="badge">⚠ Admin Access Only</div>
        <h2>Admin Login</h2>
        <div class="alert" id="alertBox"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="admin@mindcare.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" />
        </div>
        <button class="btn" id="loginBtn" onclick="login()">Login to Admin Panel</button>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const alert = document.getElementById('alertBox');

            if (!email || !password) {
                alert.textContent = 'Enter email and password.';
                alert.className = 'alert error'; return;
            }

            btn.disabled = true; btn.textContent = 'Logging in...';

            try {
                const res = await fetch('http://localhost:5000/api/auth/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (data.success && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'admin.html';
                } else {
                    alert.textContent = data.message || 'Invalid credentials.';
                    alert.className = 'alert error';
                }
            } catch (e) {
                alert.textContent = 'Network error. Try again.';
                alert.className = 'alert error';
            }

            btn.disabled = false; btn.textContent = 'Login to Admin Panel';
        }
    </script>
</body>

</html>
