<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — MindCare</title>
    <script src="config.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f4f6fb;
            color: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ─────────────────────────────────────────────── */
        .nav {
            background: #fff;
            border-bottom: 1px solid #e8eaf0;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: #6c63ff;
        }

        .nav-links a {
            font-size: 14px;
            color: #555;
            text-decoration: none;
            font-weight: 500;
            margin-left: 16px;
        }

        .nav-links a:hover {
            color: #6c63ff;
        }

        /* ── Main layout ──────────────────────────────────────── */
        .chat-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            overflow: hidden;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 16px;
            gap: 16px;
        }

        @media(max-width:680px) {
            .chat-layout {
                grid-template-columns: 1fr;
                padding: 0;
            }

            .thread-list {
                display: none;
            }

            .thread-list.show {
                display: flex;
            }

            .chat-window {
                display: none;
            }

            .chat-window.show {
                display: flex;
            }
        }

        /* ── Thread list ──────────────────────────────────────── */
        .thread-list {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .07);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .thread-list-header {
            padding: 18px 18px 14px;
            border-bottom: 1px solid #f0f0f5;
            font-size: 15px;
            font-weight: 700;
        }

        .thread-items {
            flex: 1;
            overflow-y: auto;
        }

        .thread-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f8f8fb;
            transition: background .15s;
            position: relative;
        }

        .thread-item:hover {
            background: #f8f7ff;
        }

        .thread-item.active {
            background: #f0effe;
        }

        .th-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ede9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #6c63ff;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .th-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #27ae60;
            border: 2px solid #fff;
        }

        .th-info {
            flex: 1;
            min-width: 0;
        }

        .th-name {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .th-preview {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .th-time {
            font-size: 11px;
            color: #bbb;
            flex-shrink: 0;
        }

        .unread-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #6c63ff;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* ── Chat window ──────────────────────────────────────── */
        .chat-window {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .07);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Empty state */
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            gap: 10px;
        }

        .chat-empty .icon {
            font-size: 48px;
        }

        .chat-empty p {
            font-size: 14px;
        }

        /* Chat header -->  */
        .chat-win-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f5;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-win-name {
            font-size: 15px;
            font-weight: 700;
            flex: 1;
        }

        .chat-win-status {
            font-size: 12px;
            color: #27ae60;
        }

        /* Messages -->  */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #e0e0e0;
            border-radius: 2px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 72%;
        }

        .msg.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg.other {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg.me .msg-bubble {
            background: #6c63ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.other .msg-bubble {
            background: #f4f4f8;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 11px;
            color: #bbb;
            margin-top: 3px;
            padding: 0 4px;
        }

        .sys-msg {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            padding: 4px 14px;
            background: #f8f8fb;
            border-radius: 20px;
            align-self: center;
        }

        /* Input area -->  */
        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid #f0f0f5;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .msg-input {
            flex: 1;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            min-height: 44px;
            transition: border-color .2s;
        }

        .msg-input:focus {
            border-color: #6c63ff;
        }

        .msg-input::placeholder {
            color: #bbb;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: #6c63ff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }

        .send-btn:hover {
            background: #574fd6;
        }

        /* Empty threads -->  */
        .no-threads {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            color: #aaa;
        }

        .no-threads .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .no-threads p {
            font-size: 13px;
        }

        .no-threads a {
            color: #6c63ff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Nav -->
    <nav class="nav">
        <div class="nav-logo">🌿 MindCare</div>
        <div class="nav-links">
            <a href="browse-therapists.html">Find Therapist</a>
            <a href="my-sessions.html">My Sessions</a>
            <a href="messages.html" style="color:#6c63ff">Messages</a>
        </div>
    </nav>

    <!-- Chat layout -->
    <div class="chat-layout">

        <!-- Thread list -->
        <div class="thread-list" id="threadList">
            <div class="thread-list-header">💬 Messages</div>
            <div class="thread-items" id="threadItems">
                <div class="no-threads">
                    <div class="icon">💬</div>
                    <p>No conversations yet.<br />
                        <a href="browse-therapists.html">Book a session</a> to start messaging.
                    </p>
                </div>
            </div>
        </div>

        <!-- Chat window -->
        <div class="chat-window" id="chatWindow">
            <div class="chat-empty" id="chatEmpty">
                <div class="icon">💬</div>
                <p>Select a conversation to start messaging</p>
            </div>

            <div id="chatActive" style="display:none;flex-direction:column;flex:1;overflow:hidden">
                <div class="chat-win-header">
                    <div class="th-avatar" id="activeAvatar" style="width:38px;height:38px;font-size:14px"></div>
                    <div>
                        <div class="chat-win-name" id="activeName"></div>
                        <div class="chat-win-status" id="activeStatus"></div>
                    </div>
                </div>

                <div class="messages-area" id="messagesArea">
                    <div class="sys-msg">Messages are private between you and your therapist.</div>
                </div>

                <div class="chat-input-area">
                    <textarea class="msg-input" id="msgInput" placeholder="Type a message..."
                        onkeydown="handleKey(event)" rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('mindoraToken') || localStorage.getItem('token');
        const role = 'user';
        if (!token) window.location.href = 'login.html';

        let activeTherapistId = null;
        let activeTherapistName = '';

        const socket = io(windowAPI_BASE || 'http://localhost:5000', { transports: ['websocket'] });

        // ── Init ───────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            await loadThreads();
            setupSocket();
        });

        // ── Load thread list ───────────────────────────────────
        async function loadThreads() {
            try {
                const res = await fetch(`${API_BASE}/api/chat/threads`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) return;

                renderThreads(data.data);
            } catch (e) { console.error(e); }
        }

        function renderThreads(threads) {
            const el = document.getElementById('threadItems');
            if (!threads.length) {
                el.innerHTML = `<div class="no-threads">
        <div class="icon">💬</div>
        <p>No conversations yet.<br/>
        <a href="browse-therapists.html">Book a session</a> to start messaging.</p>
      </div>`;
                return;
            }

            el.innerHTML = threads.map(t => {
                const th = t.therapistId || {};
                const initials = (th.fullName || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                const avatar = th.profilePhoto
                    ? `<img src="${th.profilePhoto}"/>`
                    : initials;
                const onlineDot = th.isOnline ? '<div class="online-dot"></div>' : '';
                const preview = t.lastMessage ? escHtml(t.lastMessage.slice(0, 40)) : 'No messages yet';
                const timeStr = t.lastMessageAt
                    ? new Date(t.lastMessageAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })
                    : '';
                const badge = t.unreadByUser > 0
                    ? `<div class="unread-badge">${t.unreadByUser}</div>` : '';

                return `<div class="thread-item" onclick="openThread('${th._id}','${escAttr(th.fullName)}','${th.profilePhoto || ''}',${!!th.isOnline})" id="thread-${th._id}">
        <div class="th-avatar">${avatar}${onlineDot}</div>
        <div class="th-info">
          <div class="th-name">${th.fullName || 'Therapist'}</div>
          <div class="th-preview">${preview}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div class="th-time">${timeStr}</div>
          ${badge}
        </div>
      </div>`;
            }).join('');
        }

        // ── Open a thread ──────────────────────────────────────
        async function openThread(therapistId, name, photo, isOnline) {
            activeTherapistId = therapistId;
            activeTherapistName = name;

            // Update active state
            document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
            const item = document.getElementById(`thread-${therapistId}`);
            if (item) { item.classList.add('active'); item.querySelector('.unread-badge')?.remove(); }

            // Set header
            const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            const avatarEl = document.getElementById('activeAvatar');
            avatarEl.innerHTML = photo ? `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>` : initials;
            document.getElementById('activeName').textContent = name;
            document.getElementById('activeStatus').textContent = isOnline ? '🟢 Online' : 'Offline';

            // Show chat area
            document.getElementById('chatEmpty').style.display = 'none';
            document.getElementById('chatActive').style.display = 'flex';

            // Join socket room for real-time
            socket.emit('join_chat', `chat-${therapistId}`);

            // Load messages
            await loadMessages(therapistId);
        }

        async function loadMessages(therapistId) {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '<div class="sys-msg">Loading...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/chat/${therapistId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) return;

                area.innerHTML = '<div class="sys-msg">Messages are private.</div>';
                data.data.messages.forEach(m => renderMsg(m, m.sender === 'user' ? 'me' : 'other'));
                area.scrollTop = area.scrollHeight;
            } catch (e) { console.error(e); }
        }

        // ── Send message ───────────────────────────────────────
        async function sendMessage() {
            if (!activeTherapistId) return;
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await fetch(`${API_BASE}/api/chat/${activeTherapistId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ text }),
                });
                const data = await res.json();

                if (data.success) {
                    renderMsg(data.data, 'me');
                    document.getElementById('messagesArea').scrollTop = 99999;
                    // Emit via socket for real-time delivery
                    socket.emit('chat_message', {
                        room: `chat-${activeTherapistId}`,
                        sender: 'user',
                        text,
                        createdAt: new Date(),
                    });
                    input.value = '';
                    input.style.height = 'auto';
                    // Refresh thread list preview
                    loadThreads();
                }
            } catch (e) { console.error(e); }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        // ── Render a message ───────────────────────────────────
        function renderMsg(msg, side) {
            const area = document.getElementById('messagesArea');
            const time = new Date(msg.createdAt).toLocaleTimeString('en-IN',
                { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerHTML = `
      <div class="msg-bubble">${escHtml(msg.text)}</div>
      <div class="msg-time">${time}</div>`;
            area.appendChild(div);
        }

        // ── Socket ─────────────────────────────────────────────
        function setupSocket() {
            socket.on('chat_message', ({ sender, text, createdAt }) => {
                if (sender !== 'user') {
                    renderMsg({ text, createdAt }, 'other');
                    document.getElementById('messagesArea').scrollTop = 99999;
                }
            });
        }

        // ── Helpers ────────────────────────────────────────────
        function escHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escAttr(str) {
            return (str || '').replace(/'/g, "\\'");
        }
    </script>
</body>

</html>
